name: CLI checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      TMPDIR: /tmp
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Prepare the read-only filesystem sandbox
        run: bash scripts/prepare-linux-sandbox.sh
      - name: Prepare Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt
      - name: Check formatting and test the standalone client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/sandbox/build.py
          bash scripts/test.sh
