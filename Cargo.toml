[package]
name = "codejournal-cli"
version = "0.1.0"
edition = "2024"
description = "Code Journal device client"
license = "MIT"
readme = "README.md"
homepage = "https://codejournal.online"
repository = "https://github.com/illegalstudio/codejournal-cli"
keywords = ["journal", "cli", "developer-tools", "agents"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "cj"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6"
fs2 = "0.4"
keyring = { package = "keyring-core", version = "1" }
libc = "0.2"
regex = "1"
sha2 = "0.10"
shell-words = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"
webbrowser = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"
