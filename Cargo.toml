[package]
name = "codejournal-cli"
version = "0.1.0"
edition = "2024"
description = "Code Journal device client"
license = "MIT"

[[bin]]
name = "cj"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive", "env"] }
directories = "6"
fs2 = "0.4"
keyring = "4.2"
libc = "0.2"
regex = "1"
sha2 = "0.10"
shell-words = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
webbrowser = "1"
uuid = { version = "1", features = ["v4"] }
